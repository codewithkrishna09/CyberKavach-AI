<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CyberKavach AI Node</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            /* Light SaaS Theme Palette */
            --bg: #f8fafc;        /* Slate 50 - Main Background */
            --panel: #ffffff;     /* White - Cards */
            --primary: #4f46e5;   /* Indigo 600 - Brand Color */
            --danger: #ef4444;    /* Red 500 */
            --success: #10b981;   /* Emerald 500 */
            --warning: #f59e0b;   /* Amber 500 */
            --text-main: #0f172a; /* Slate 900 */
            --text-muted: #64748b;/* Slate 500 */
            --border: #e2e8f0;    /* Slate 200 */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Chrome calculates an extension popup's viewport from its document.
           Using 100vw here creates a circular calculation and can collapse
           the popup into a thin strip, so use a stable desktop popup size. */
        html, body { width: 360px; height: 540px; overflow: hidden; }

        body {
            /* Keep every control inside Chrome's popup viewport. */
            width: 360px;
            height: 540px;
            background: var(--bg); 
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            display: flex; 
            flex-direction: column;
            position: relative;
            min-height: 0;
        }

        /* 🌌 Subtle Grid Background */
        .mesh-bg {
            position: absolute; inset: 0; z-index: -1;
            background-size: 20px 20px;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
        }

        /* 🟢 HEADER */
        header {
            padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px); 
            z-index: 10;
        }
        .brand { 
            font-size: 15px; font-weight: 800; letter-spacing: -0.5px; 
            display: flex; align-items: center; gap: 8px; 
            color: var(--text-main);
        }
        .brand svg { color: var(--primary); }
        
        /* 🎯 MAIN SCANNER (Clean Radar) */
        .scan-area {
            /* min-height: 0 is essential in a flex popup: it lets this visual
               area shrink instead of pushing the controls below the viewport. */
            flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 8px 20px 12px; position: relative;
        }

        .radar {
            width: 92px; height: 92px; position: relative;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
        }
        .radar-ring {
            position: absolute; border: 1.5px solid var(--primary); border-radius: 50%;
            width: 100%; height: 100%; opacity: 0;
            animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        .radar-icon {
            width: 58px; height: 58px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: all 0.4s ease; color: var(--primary);
        }
        
        @keyframes ping {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .verdict { font-size: 22px; font-weight: 900; margin-bottom: 7px; letter-spacing: -0.5px; text-transform: uppercase; text-align: center; transition: color 0.3s;}
        
        .url-box { 
            font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); 
            background: var(--panel); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border);
            max-width: 280px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            text-align: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        /* 📊 METRICS GRID */
        .metrics {
            display: grid; grid-template-columns: 1fr; gap: 12px;
            width: 100%; padding: 0 20px; margin-bottom: 12px; flex: 0 0 auto;
        }
        .metric-card {
            background: var(--panel); border: 1px solid var(--border);
            padding: 11px 13px; border-radius: 14px; position: relative; overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .metric-label { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 4px; letter-spacing: 0.5px;}
        .metric-val { font-size: 16px; font-weight: 800; font-family: 'JetBrains Mono', monospace; transition: color 0.3s; color: var(--text-main);}
        
        .progress { height: 4px; background: var(--bg); border-radius: 2px; margin-top: 8px; overflow: hidden; border: 1px solid var(--border);}
        .bar { height: 100%; width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s; }

        /* 🎮 CONTROL PANEL (Bottom Section) */
        .controls {
            padding: 12px 20px 14px; background: var(--panel);
            border-top: 1px solid var(--border);
            flex: 0 0 auto;
        }

        .input-box { position: relative; margin-bottom: 12px; }
        .input-box svg { position: absolute; left: 14px; top: 13px; width: 16px; color: var(--text-muted); }
        input {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            padding: 12px 12px 12px 42px; color: var(--text-main); border-radius: 10px;
            font-size: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); background: var(--panel); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        input::placeholder { color: #94a3b8; font-weight: 400;}

        .btn {
            width: 100%; padding: 11px; border: none; border-radius: 10px;
            font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        .btn-primary:hover { transform: translateY(-1px); background: #4338ca; box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);}
        .btn-primary:active { transform: translateY(1px); }
        
        .btn-outline { background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); }
        .btn-outline:hover { background: #f1f5f9; color: var(--text-main); border-color: #cbd5e1; }

        /* Feedback stays compact so the security controls remain visible in the
           fixed-size popup. It records the current site's verdict only. */
        .feedback-panel {
            margin: 0 0 8px;
            padding: 7px 8px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
        }
        .feedback-title { display: block; margin-bottom: 5px; font-size: 10px; font-weight: 800; color: var(--text-muted); }
        .feedback-actions { display: flex; gap: 7px; }
        .feedback-btn {
            flex: 1; min-width: 0; padding: 6px; border: 1px solid var(--border);
            border-radius: 7px; background: #fff; color: var(--text-muted); cursor: pointer;
            font-size: 10px; font-weight: 800; transition: .2s;
        }
        .feedback-btn:hover { border-color: var(--primary); color: var(--primary); background: #eef2ff; }
        .feedback-btn.report:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }
        .feedback-btn:disabled { cursor: wait; opacity: .6; }
        .feedback-status { display: block; min-height: 10px; margin-top: 4px; font-size: 9px; font-weight: 700; color: var(--text-muted); }

        /* Extra safety for unusually small Chrome popup windows. */
        @media (max-height: 500px) {
            body { height: 500px; }
            header { padding: 11px 18px; }
            .radar { width: 76px; height: 76px; margin-bottom: 7px; }
            .radar-icon { width: 50px; height: 50px; }
            .verdict { font-size: 19px; }
            .metrics { margin-bottom: 8px; }
            .metric-card { padding: 8px 11px; }
            .controls { padding: 8px 18px 10px; }
            .feedback-panel { display: none; }
        }

        .hidden { display: none !important; }

        /* ========================================== */
        /* 🚨 STATE CLASSES (Triggered by JS)         */
        /* ========================================== */
        
        /* MALWARE / PHISHING STATE */
        body.danger .radar-icon { border-color: var(--danger); background: #fef2f2; color: var(--danger); box-shadow: 0 10px 25px rgba(239, 68, 68, 0.2);}
        body.danger .radar-ring { border-color: var(--danger); animation-duration: 1s;} 
        body.danger .verdict { color: var(--danger); }
        body.danger .grid-bg { background-image: linear-gradient(rgba(239, 68, 68, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(239, 68, 68, 0.05) 1px, transparent 1px); }

        /* SAFE STATE */
        body.safe .radar-icon { border-color: var(--success); background: #f0fdf4; color: var(--success); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);}
        body.safe .radar-ring { border-color: var(--success); animation-duration: 3s;} 
        body.safe .verdict { color: var(--success); }
        body.safe .grid-bg { background-image: linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px); }

    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <header>
        <div class="brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Cyberkavach.AI

        </div>
    </header>

    <div class="scan-area">
        <div class="radar">
            <div class="radar-ring"></div>
            <div class="radar-ring" style="animation-delay: 1.2s"></div>
            <div class="radar-icon" id="statusIcon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </div>
        </div>
        <h2 id="verdict" class="verdict">ANALYZING</h2>
        <div id="url" class="url-box">Establishing connection...</div>
    </div>

    <div class="metrics">
        <div class="metric-card">
            <span class="metric-label">Threat Score</span>
            <span class="metric-val" id="riskScore">--/100</span>
            <div class="progress"><div class="bar" id="riskBar" style="background: var(--danger); width: 0%;"></div></div>
        </div>
    </div>

    <div class="controls">
        <button id="btnDashboard" class="btn btn-primary" style="margin-bottom: 8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
           VIEW SCAN REPORT
        </button>
        <div id="feedbackPanel" class="feedback-panel hidden" aria-label="Scan feedback">
            <span class="feedback-title">Was this warning correct?</span>
            <div class="feedback-actions">
                <button id="btnWrongAlert" class="feedback-btn" type="button">Wrong alert</button>
                <button id="btnReportScam" class="feedback-btn report" type="button">Report scam</button>
            </div>
            <span id="feedbackStatus" class="feedback-status" aria-live="polite"></span>
        </div>
        <div class="btn btn-outline" style="pointer-events: none; color: var(--success); font-weight: bold; border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05);">Shield Active</div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
